name: Daily Supabase Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: oh-finance-backup
          workload_identity_provider: projects/368540196207/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: oh-finance-backup@oh-finance-backup.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Create database backup with PostgreSQL 17
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          mkdir -p backup
          DATE="$(TZ=Asia/Jerusalem date +'%Y-%m-%d_%H-%M-%S')"
          FILE="OH-Finance_${DATE}.dump"

          docker run --rm             -e SUPABASE_DB_URL="$SUPABASE_DB_URL"             -v "$PWD/backup:/backup"             postgres:17             sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file="/backup/'"$FILE"'"'

          gzip "backup/$FILE"
          echo "BACKUP_FILE=${FILE}.gz" >> "$GITHUB_ENV"

      - name: Verify backup
        run: |
          set -euo pipefail

          test -s "backup/$BACKUP_FILE"

          echo "Backup created:"
          ls -lh "backup/$BACKUP_FILE"

      - name: Upload to Google Drive
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl             --fail-with-body             --silent             --show-error             -X POST             -H "Authorization: Bearer $ACCESS_TOKEN"             -F "metadata={\"name\":\"$BACKUP_FILE\",\"parents\":[\"$GDRIVE_FOLDER_ID\"]};type=application/json;charset=UTF-8"             -F "file=@backup/$BACKUP_FILE;type=application/gzip"             "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name")

          echo "$RESPONSE"

          FILE_ID=$(echo "$RESPONSE" | python3 -c             'import json,sys; print(json.load(sys.stdin)["id"])')

          test -n "$FILE_ID"

          echo "Backup uploaded successfully to Google Drive."
          echo "Google Drive File ID: $FILE_ID"
