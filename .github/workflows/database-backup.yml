name: Daily Supabase Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create database backup with PostgreSQL 17
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          mkdir -p backup
          DATE="$(TZ=Asia/Jerusalem date +'%Y-%m-%d_%H-%M-%S')"
          FILE="OH-Finance_${DATE}.dump"

          docker run --rm             -e SUPABASE_DB_URL="$SUPABASE_DB_URL"             -v "$PWD/backup:/backup"             postgres:17             sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file="/backup/'"$FILE"'"'

          gzip "backup/$FILE"
          echo "BACKUP_FILE=${FILE}.gz" >> "$GITHUB_ENV"

      - name: Verify backup
        run: |
          set -euo pipefail
          test -s "backup/$BACKUP_FILE"
          echo "Backup created:"
          ls -lh "backup/$BACKUP_FILE"

      - name: Get Google Drive access token
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl             --fail-with-body             --silent             --show-error             -X POST             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "client_id=$GOOGLE_CLIENT_ID"             --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET"             --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN"             --data-urlencode "grant_type=refresh_token"             "https://oauth2.googleapis.com/token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c             'import json,sys; data=json.load(sys.stdin); print(data["access_token"])')

          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "GOOGLE_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Upload to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl             --fail-with-body             --silent             --show-error             -X POST             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             -F "metadata={\"name\":\"$BACKUP_FILE\",\"parents\":[\"$GDRIVE_FOLDER_ID\"]};type=application/json;charset=UTF-8"             -F "file=@backup/$BACKUP_FILE;type=application/gzip"             "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name")

          echo "$RESPONSE"

          FILE_ID=$(echo "$RESPONSE" | python3 -c             'import json,sys; print(json.load(sys.stdin)["id"])')

          test -n "$FILE_ID"
          echo "Backup uploaded successfully to Google Drive."
          echo "Google Drive File ID: $FILE_ID"

      - name: Delete backups older than 15 days
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GOOGLE_ACCESS_TOKEN"]
          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          cutoff = datetime.now(timezone.utc) - timedelta(days=15)
          cutoff_rfc3339 = cutoff.strftime("%Y-%m-%dT%H:%M:%SZ")

          query = f"'{folder_id}' in parents and trashed = false and createdTime < '{cutoff_rfc3339}'"
          params = urllib.parse.urlencode({
              "q": query,
              "fields": "files(id,name,createdTime),nextPageToken",
              "pageSize": 1000,
          })

          url = "https://www.googleapis.com/drive/v3/files?" + params
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"},
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          deleted = 0
          for item in data.get("files", []):
              name = item.get("name", "")
              if not (name.startswith("OH-Finance_") and name.endswith(".dump.gz")):
                  continue

              delete_url = "https://www.googleapis.com/drive/v3/files/" + urllib.parse.quote(item["id"])
              delete_req = urllib.request.Request(
                  delete_url,
                  headers={"Authorization": f"Bearer {token}"},
                  method="DELETE",
              )

              with urllib.request.urlopen(delete_req) as response:
                  response.read()

              deleted += 1
              print(f"Deleted old backup: {name}")

          print(f"Retention cleanup complete. Deleted {deleted} backup(s) older than 15 days.")
          PY
